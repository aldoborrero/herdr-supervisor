[package]
name = "herdr-supervisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Durable supervision of Herdr agents with isolated worktrees and native messaging"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
jiff = "0.2"
jsonc-parser = { version = "0.33", features = ["cst", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
toml_edit = "0.23"

rusqlite = { version = "=0.37.0", features = ["bundled"] }
uuid = { version = "=1.23.4", features = ["v4", "serde"] }
ed25519-dalek = "=2.2.0"
getrandom = "=0.2.17"
bs58 = "=0.5.1"
async-nats = "0.50.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "signal"] }
futures-util = "0.3.34"
libc = "=0.2.189"
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
